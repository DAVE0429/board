name: Deploy to EC2

on:
  push:
    branches: [ "main" ]  # main 브랜치에 푸시될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. 코드 체크아웃
    - uses: actions/checkout@v3

    # 2. JDK 17 설치 (프로젝트 버전에 맞게 수정)
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Gradle 빌드 (jar 생성)
    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew build

    - name: Check Secrets
      run: |
        if [ -z "${{ secrets.EC2_HOST }}" ]; then echo "HOST is EMPTY"; else echo "HOST is SET"; fi
        if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then echo "KEY is EMPTY"; else echo "KEY is SET"; fi

    # 4. 빌드된 Jar를 EC2로 전송 (SCP)
    - name: Copy Jar to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}       # Github Settings > Secrets에 등록 필요
        username: ubuntu
        key: "${{ secrets.EC2_SSH_KEY }}"     # pem 키 내용 전체
        source: "api/build/libs/*.jar"
        target: "/home/ubuntu/" # EC2 내 임시 업로드 폴더
        strip_components: 3                 # 경로 떼고 파일만 복사

    # 5. EC2 접속하여 배포 스크립트 실행
    - name: Execute Deploy Script
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 아까 만든 deploy.sh 실행 (파일명만 맞춰주세요)
          chmod +x /home/ubuntu/deploy.sh
          /home/ubuntu/deploy.sh
